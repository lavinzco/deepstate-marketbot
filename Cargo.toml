[package]
name = "deepstate-mm"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "2.4", features = ["contract", "providers", "signers", "sol-types", "rpc-types", "node-bindings"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
